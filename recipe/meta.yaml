{% set name = "azure-cli-core" %}
{% set version = "2.85.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_')}}-{{ version }}.tar.gz
  sha256: a5bb30cd88eb0a5082c46be9da2ed5a51509e2b94a1b5574e7f63faa4bb1e1d9

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  skip: true  # [py<310]

requirements:
  host:
    - pip
    - python
    - wheel
    - setuptools
  run:
    - python
    - argcomplete >=3.5.2,<3.6
    - azure-cli-telemetry ==1.1.0
    - azure-core >=1.39.0,<1.40
    - azure-mgmt-core >=1.2.0,<2
    - cryptography
    - distro  # [linux]
    - humanfriendly >=10.0,<11
    - jmespath
    - knack >=0.11.0,<0.12
    - microsoft-security-utilities-secret-masker >=1.0.0b4,<1.0.1
    - msal_extensions ==1.2.0
    - msal ==1.35.1
    - packaging >=20.9
    - pkginfo >=1.5.0.1
    - pyjwt >=2.1.0
    - pyopenssl >=17.1.0
    - py-deviceid
    - requests
  run_constrained:
    # msal[broker] -> pymsalruntime
    - pymsalruntime >=0.14,<0.21  # [win]
    # requests[socks] -> pysocks
    - pysocks >=1.5.6,!=1.5.7

test:
  imports:
    - azure
    - azure.cli
    - azure.cli.core
    - azure.cli.core.commands
    - azure.cli.core.extension
    - azure.cli.core.profiles

about:
  home: https://github.com/Azure/azure-cli
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Microsoft Azure Command-Line Tools Core Module

  doc_url: https://docs.microsoft.com/en-us/cli/azure
  dev_url: https://github.com/Azure/azure-cli

extra:
  recipe-maintainers:
    - andreyz4k
